<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusShelf | Register</title>

    <link rel="stylesheet" href="../css/register.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="container">

    <div class="left">

        <h1>Create Account 🚀</h1>

        <p>Create your CampusShelf account</p>

    </div>

    <div class="right">

        <form id="registerForm">

            <h2>Register</h2>
            <div class="input-box">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="fullname" placeholder="Full Name">
            </div>
            
            <div class="input-box">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="email" placeholder="College Email">
            </div>
            
            <div class="input-box">
                <i class="fa-solid fa-phone"></i>
                <input type="tel" id="mobile" placeholder="Mobile Number">
            </div>
            
            <div class="input-box">
                <i class="fa-solid fa-building-columns"></i>
                <input type="text" id="college" placeholder="College Name">
            </div>
            
            <div class="input-box">
                <i class="fa-solid fa-building"></i>
            
                <select id="department">
                    <option value="">Select Department</option>
                    <option>CSE</option>
                    <option>AI & DS</option>
                    <option>IT</option>
                    <option>ENTC</option>
                    <option>Mechanical</option>
                    <option>Civil</option>
                </select>
            </div>
            
            <div class="input-box">
                <i class="fa-solid fa-graduation-cap"></i>
            
                <select id="semester">
                    <option value="">Select Semester</option>
                    <option>Semester 1</option>
                    <option>Semester 2</option>
                    <option>Semester 3</option>
                    <option>Semester 4</option>
                    <option>Semester 5</option>
                    <option>Semester 6</option>
                    <option>Semester 7</option>
                    <option>Semester 8</option>
                </select>
            </div>
            
            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" placeholder="Password">
            </div>
            
            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="confirmPassword" placeholder="Confirm Password">
            </div>

            <button type="submit" class="signin">

                Create Account
            
            </button>
            
            <p class="bottom-text">
            
            Already have an account?
            
            <a href="login.html">Login</a>
            
            </p>
            
            </form>
            
            </div>
            
            </div>
            
            <script src="../js/register.js"></script>
            
            </body>
            
            </html>
